name: Auto-approve bot PRs

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  approve:
    if: github.actor == 'cseci'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve PR
        run: gh pr review --approve "${{ github.event.number }}" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
